<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUD - Gestionare Produse (Local Storage)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1> Gestionare Produse</h1>
    <p class="subtitle">Lecția 7-8 — Mini-aplicație CRUD cu colecții de obiecte și Local Storage</p>
  </header>

  <main>
    <section class="form-card">
      <h2 id="form-title">Adaugă produs nou</h2>
      <form id="product-form">
        <input type="hidden" id="product-id">

        <label for="nume">Nume produs</label>
        <input type="text" id="nume" placeholder="ex: Laptop Dell" required>

        <label for="categorie">Categorie</label>
        <input type="text" id="categorie" placeholder="ex: Electronice" required>

        <label for="pret">Preț (lei)</label>
        <input type="number" id="pret" min="0" step="0.01" placeholder="ex: 2500" required>

        <label for="cantitate">Cantitate în stoc</label>
        <input type="number" id="cantitate" min="0" step="1" placeholder="ex: 10" required>

        <div class="form-actions">
          <button type="submit" id="submit-btn">Adaugă produs</button>
          <button type="button" id="cancel-btn" class="secondary hidden">Anulează editarea</button>
        </div>
      </form>
    </section>

    <section class="list-card">
      <div class="list-header">
        <h2>Produse înregistrate</h2>
        <input type="text" id="search" placeholder=" Caută după nume sau categorie...">
      </div>

      <table id="product-table">
        <thead>
          <tr>
            <th>Nume</th>
            <th>Categorie</th>
            <th>Preț</th>
            <th>Stoc</th>
            <th>Acțiuni</th>
          </tr>
        </thead>
        <tbody id="product-list"></tbody>
      </table>

      <p id="empty-message" class="hidden">Nu există produse. Adaugă primul produs folosind formularul de mai sus.</p>

      <div class="stats">
        <span id="total-count">0 produse</span>
        <button id="clear-all-btn" class="danger">Șterge tot</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
